    <style>
        :root {
            --bg: #E9F0F6;
            --surface: #FFFFFF;
            --line: #DCE8EF;
            --text: #1B2A3A;
            --accent: #3B82C4;
            --accent-deep: #1F3A5F;
            --shadow: 0 2px 12px rgba(31, 58, 95, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: Nunito, ui-rounded, 'Segoe UI', system-ui, Roboto, sans-serif;
        }
        main { width: 100%; max-width: 360px; text-align: center; }
        .logo { width: 88px; height: 88px; margin-bottom: 12px; }
        h1 { margin: 0 0 28px; font-size: 28px; color: var(--accent-deep); }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 56px;
            margin-bottom: 14px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            color: var(--accent-deep);
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }
        .btn { width: 100%; font-family: inherit; cursor: pointer; }
        .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
        .btn svg { width: 24px; height: 24px; flex: none; }
        dialog {
            width: calc(100% - 32px);
            max-width: 380px;
            padding: 24px 20px 20px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 8px 32px rgba(31, 58, 95, 0.25);
            font-family: inherit;
        }
        dialog::backdrop { background: rgba(27, 42, 58, 0.45); }
        dialog h2 { margin: 0 0 16px; font-size: 20px; color: var(--accent-deep); text-align: center; }
        dialog ul { list-style: none; margin: 0 0 16px; padding: 0; }
        dialog li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        dialog li:last-child { border-bottom: none; }
        dialog li span { font-size: 15px; overflow-wrap: anywhere; text-align: left; }
        dialog button { font-family: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; }
        .copy {
            flex: none;
            min-width: 76px;
            padding: 8px 12px;
            border: 1px solid var(--accent);
            background: var(--surface);
            color: var(--accent);
            font-size: 14px;
        }
        .copy.ok { background: var(--accent); color: #fff; }
        dialog h3 { margin: 4px 0 6px; font-size: 15px; color: var(--accent-deep); text-align: left; }
        .social a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }
        .social a:hover, .social a:focus-visible { text-decoration: underline; }
        .social svg { width: 20px; height: 20px; flex: none; }
        .close {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--accent-deep);
            color: #fff;
            font-size: 16px;
        }
        .lang-switch { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
        .lang-switch a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: 999px; color: var(--accent-deep); font-weight: 700; text-decoration: none; }
        .lang-switch a:hover { text-decoration: underline; }
        .lang-switch a[aria-current="true"] { box-shadow: inset 0 0 0 1.5px currentColor; }
    </style>
</head>
<body>

        <nav class="lang-switch" aria-label="Language"><a href="../liens.html" hreflang="fr" lang="fr" title="Français">FR</a><a href="liens.html" hreflang="en" lang="en" title="English" aria-current="true">EN</a><a href="../de/liens.html" hreflang="de" lang="de" title="Deutsch">DE</a></nav>

    <script>
        (function () {
            var dlg = document.getElementById('contact');
            document.getElementById('contact-open').addEventListener('click', function () { dlg.showModal(); });
            document.getElementById('contact-close').addEventListener('click', function () { dlg.close(); });
            dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
                dlg.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } finally { ta.remove(); }
            }
            dlg.querySelectorAll('.copy').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var email = btn.dataset.email;
                    var done = function () {
                        btn.textContent = 'Copied!'; btn.classList.add('ok');
                        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
                    };
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(email).then(done, function () { fallbackCopy(email); done(); });
                    } else { fallbackCopy(email); done(); }
                });
            });
        })();
    </script>
