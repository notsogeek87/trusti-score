services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=${BACKEND_PORT:-3001}
    ports:
      # Le backend n'est joignable que depuis la machine locale.
      # C'est nginx (déjà en écoute sur 80/443) qui l'expose publiquement via proxy_pass.
      # BACKEND_PORT vient du fichier .env à la racine (voir .env.example) : ça permet
      # de faire tourner un checkout "production" (ex: 3001) et un checkout "staging"
      # (ex: 3002) sur le même VPS sans conflit de port.
      - "127.0.0.1:${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
