# Configuration Nginx pour TrustiScore sur VPS (template pour prod ET staging)
#
# Installation (exemple pour la production) :
#   sudo cp deploy/nginx-trustiscore.conf /etc/nginx/sites-available/trustiscore.conf
#   sudo sed -i \
#     -e 's/VOTRE_DOMAINE/trustiscore.exemple.com/g' \
#     -e 's#__APP_ROOT__#/var/www/trustiscore#g' \
#     -e 's/__APP_PORT__/3001/g' \
#     /etc/nginx/sites-available/trustiscore.conf
#   sudo ln -s /etc/nginx/sites-available/trustiscore.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d trustiscore.exemple.com   # ajoute le HTTPS automatiquement
#
# Pour le staging, refaites la même chose avec un autre nom de fichier
# (ex: trustiscore-staging.conf), un autre sous-domaine, __APP_ROOT__
# pointant vers le checkout staging et __APP_PORT__=3002.

limit_req_zone $binary_remote_addr zone=trustiscore_admin:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=trustiscore_general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=trustiscore_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE;

    root __APP_ROOT__;
    index index.html;

    limit_conn trustiscore_conn 10;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend Node.js/Express (conteneur Docker en local)
    location /api/ {
        limit_req zone=trustiscore_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protection renforcée pour l'interface admin
    location = /admin.html {
        limit_req zone=trustiscore_admin burst=5 nodelay;
        limit_req_status 429;

        if ($http_user_agent ~* (bot|crawler|spider|scraper)) {
            return 403;
        }

        try_files $uri =404;
    }

    # Assets statiques : cache long
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Bloque les fichiers sensibles / de doc
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(md|json|example|env|ps1)$ {
        deny all;
        access_log off;
    }

    location / {
        limit_req zone=trustiscore_general burst=20 nodelay;
        try_files $uri $uri.html $uri/ =404;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT)$ ) {
        return 405;
    }

    access_log /var/log/nginx/trustiscore-access.log;
    error_log /var/log/nginx/trustiscore-error.log warn;
}
