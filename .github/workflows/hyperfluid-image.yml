name: Hyperfluid image

# À chaque push sur main : construction de l'image, publication sur ghcr.io,
# puis création du tag hyperfluid-v1.0.N. Hyperfluid suit ces tags (hyperfluid.toml)
# et redéploie le site. Vercel n'est pas concerné.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/seed-config.yml"

concurrency:
  group: hyperfluid-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier la syntaxe du serveur
        run: node --check backend/server.js

      - name: Version
        run: |
          echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "NEW_TAG=hyperfluid-v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Construire l'image
        run: docker build -t "ghcr.io/notsogeek87/trusti-score:${VERSION}" .

      - name: Test de démarrage (sans base, l'image doit au moins se lancer)
        run: |
          docker run -d --name t -e DATABASE_URL=postgres://x:x@127.0.0.1:1/x "ghcr.io/notsogeek87/trusti-score:${VERSION}"
          sleep 5
          docker logs t 2>&1 | tail -5
          docker rm -f t >/dev/null

      - name: Publier sur ghcr.io
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/notsogeek87/trusti-score:${VERSION}"

      - name: Créer le tag (une fois l'image publiée)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"
